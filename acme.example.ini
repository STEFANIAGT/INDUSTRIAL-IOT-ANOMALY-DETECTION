[basic.config]
cseType = MN
cseID = id-mn
cseName = cse-mn
serviceProviderID = //acme.example.com
adminID = CAdmin
networkInterface = 127.0.0.1
cseHost = 127.0.0.1
registrarCseID = id-in
registrarCseName = cse-in
registrarCseHost = 127.0.0.1
registrarCsePort = 8081
databaseType = tinydb
httpPort = 8080
consoleTheme = dark
consoleType = rich
logLevel = debug

[http]
enableManagementEndpoint = true
enableStructureEndpoint = true
enableUpperTesterEndpoint = true

[textui]
startWithTUI = false

[cse.registration]
allowedCSROriginators = /id-in,/id-mn,/id-asn

[cse.operation.requests]
enable = true
